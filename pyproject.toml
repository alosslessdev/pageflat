[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pageflat"
version = "0.1.0"
description = "Turn photographs of pages into flatbed-looking scans"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10.0",
    "scipy>=1.10",
    "torch>=2.1",
    "torchvision>=0.16",
    "timm>=0.9",
    "py-reform>=0.1.3",
    "tqdm>=4.60",
]

[project.scripts]
pageflat = "pageflat.cli:main"

[tool.setuptools.packages.find]
include = ["pageflat*"]
